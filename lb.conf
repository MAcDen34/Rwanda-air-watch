# /etc/nginx/sites-available/rwanda-air
# lb-01 — round-robin across web-01 and web-02
# each worker handles different concerns but both expose /health
# so nginx can verify they're up before routing

upstream ingestion_workers {
    # web-01 runs the ingestion service
    server web-01-IP:8001 max_fails=3 fail_timeout=30s;
}

upstream analysis_workers {
    # web-02 runs the analysis service
    server web-02-IP:8002 max_fails=3 fail_timeout=30s;
}

# general upstream for the /status and /health routes
# this round-robins between both workers — either can serve these
upstream all_workers {
    server web-01-IP:8001 max_fails=3 fail_timeout=30s;
    server web-02-IP:8002 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;  # replace with your lb-01 domain or IP if you have one

    # health check for the load balancer itself
    location /health {
        proxy_pass http://all_workers;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ingestion routes go to web-01 only
    location /poll/ {
        proxy_pass http://ingestion_workers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /readings/ {
        proxy_pass http://ingestion_workers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # analysis routes go to web-02 only
    location /analyze/ {
        proxy_pass http://analysis_workers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /alerts/ {
        proxy_pass http://analysis_workers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /status can go to either — it's read-only
    location /status {
        proxy_pass http://all_workers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # anything else also round-robins
    location / {
        proxy_pass http://all_workers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
