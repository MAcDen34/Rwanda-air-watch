<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rwanda Air Watch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0f0a;
      --surface: #111811;
      --card: #161e16;
      --border: #243024;
      --green: #4ade80;
      --green-dim: #166534;
      --yellow: #fbbf24;
      --orange: #f97316;
      --red: #ef4444;
      --muted: #4b6b4b;
      --text: #e2f0e2;
      --text-dim: #6b8f6b;
      --mono: 'Space Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* grid texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(74,222,128,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,222,128,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      border-bottom: 1px solid var(--border);
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(8px);
    }

    .logo {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .logo-eyebrow {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--green);
      text-transform: uppercase;
    }

    .logo-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--green);
      border: 1px solid var(--green-dim);
      padding: 6px 14px;
      border-radius: 100px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 40px;
    }

    /* controls bar */
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 40px;
      flex-wrap: wrap;
      align-items: center;
    }

    .controls label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-right: 4px;
    }

    select, button {
      font-family: var(--mono);
      font-size: 12px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      outline: none;
    }

    select:hover, select:focus {
      border-color: var(--green);
    }

    button {
      background: var(--green-dim);
      border-color: var(--green);
      color: var(--green);
      letter-spacing: 0.05em;
    }

    button:hover {
      background: var(--green);
      color: var(--bg);
    }

    button:active {
      transform: scale(0.97);
    }

    button.loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .sort-btn {
      background: var(--card);
      color: var(--text-dim);
      border-color: var(--border);
    }

    .sort-btn.active {
      border-color: var(--green);
      color: var(--green);
    }

    /* section label */
    .section-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    /* cards grid */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 48px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.4s ease both;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: var(--green-dim);
      transform: translateY(-2px);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }

    .card.aqi-good::before { background: var(--green); }
    .card.aqi-moderate::before { background: var(--yellow); }
    .card.aqi-unhealthy::before { background: var(--orange); }
    .card.aqi-hazardous::before { background: var(--red); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .city-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .aqi-badge {
      font-family: var(--mono);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .aqi-good .aqi-badge    { background: rgba(74,222,128,0.15); color: var(--green); border: 1px solid var(--green-dim); }
    .aqi-moderate .aqi-badge { background: rgba(251,191,36,0.15); color: var(--yellow); border: 1px solid #92400e; }
    .aqi-unhealthy .aqi-badge { background: rgba(249,115,22,0.15); color: var(--orange); border: 1px solid #7c2d12; }
    .aqi-hazardous .aqi-badge { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid #7f1d1d; }

    .pollutants {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .pollutant {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .pollutant-label {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .pollutant-value {
      font-family: var(--mono);
      font-size: 18px;
      color: var(--text);
      font-weight: 700;
    }

    .pollutant-unit {
      font-size: 10px;
      color: var(--muted);
      font-weight: 400;
    }

    .card-footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }

    /* alerts section */
    .alerts-section {
      margin-top: 8px;
    }

    .alert-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--red);
      border-radius: 8px;
      margin-bottom: 10px;
      font-family: var(--mono);
      font-size: 12px;
      animation: fadeUp 0.3s ease both;
    }

    .alert-city {
      color: var(--red);
      font-weight: 700;
      min-width: 80px;
    }

    .alert-pollutant {
      color: var(--orange);
      min-width: 60px;
    }

    .alert-zscore {
      color: var(--text-dim);
      flex: 1;
    }

    .alert-time {
      color: var(--muted);
      font-size: 10px;
    }

    .empty-state {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-dim);
      padding: 24px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      text-align: center;
    }

    .error-banner {
      background: rgba(239,68,68,0.1);
      border: 1px solid #7f1d1d;
      color: var(--red);
      font-family: var(--mono);
      font-size: 12px;
      padding: 12px 18px;
      border-radius: 8px;
      margin-bottom: 24px;
      display: none;
    }

    .error-banner.visible { display: block; }

    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      padding: 24px 40px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    footer a {
      color: var(--text-dim);
      text-decoration: none;
    }

    footer a:hover { color: var(--green); }

    @media (max-width: 600px) {
      header, main, footer { padding-left: 20px; padding-right: 20px; }
      .cards { grid-template-columns: 1fr; }
      .controls { gap: 8px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-eyebrow">Real-time monitoring</span>
    <span class="logo-title">Rwanda Air Watch</span>
  </div>
  <div class="live-badge">
    <span class="live-dot"></span>
    LIVE
  </div>
</header>

<main>

  <div class="error-banner" id="errorBanner"></div>

  <!-- controls -->
  <div class="controls">
    <label>City</label>
    <select id="cityFilter">
      <option value="">All Cities</option>
      <option value="Kigali">Kigali</option>
      <option value="Musanze">Musanze</option>
      <option value="Rubavu">Rubavu</option>
    </select>

    <label>Sort AQI</label>
    <button class="sort-btn active" id="sortDesc" onclick="setSort('desc')">High → Low</button>
    <button class="sort-btn" id="sortAsc" onclick="setSort('asc')">Low → High</button>

    <button id="refreshBtn" onclick="loadReadings()">Refresh</button>
    <button onclick="triggerPoll()">Poll Now</button>
  </div>

  <!-- readings cards -->
  <p class="section-label">Current Readings</p>
  <div class="cards" id="cardsGrid">
    <div class="empty-state">Loading air quality data...</div>
  </div>

  <!-- alerts -->
  <p class="section-label">Recent Anomaly Alerts</p>
  <div class="alerts-section" id="alertsList">
    <div class="empty-state">Checking for alerts...</div>
  </div>

</main>

<footer>
  <span>Data: <a href="https://open-meteo.com" target="_blank">Open-Meteo Air Quality API</a> &nbsp;|&nbsp; Alerts: <a href="https://africastalking.com" target="_blank">Africa's Talking</a></span>
  <span id="lastUpdated">—</span>
</footer>

<script>
  // point this at your load balancer public IP
  const LB = 'http://18.207.186.124';

  let currentSort = 'desc';

  function setSort(dir) {
    currentSort = dir;
    document.getElementById('sortDesc').classList.toggle('active', dir === 'desc');
    document.getElementById('sortAsc').classList.toggle('active', dir === 'asc');
    loadReadings();
  }

  function aqiClass(aqi) {
    if (!aqi) return '';
    if (aqi <= 50)  return 'aqi-good';
    if (aqi <= 100) return 'aqi-moderate';
    if (aqi <= 150) return 'aqi-unhealthy';
    return 'aqi-hazardous';
  }

  function aqiLabel(aqi) {
    if (!aqi) return '—';
    if (aqi <= 50)  return 'GOOD';
    if (aqi <= 100) return 'MODERATE';
    if (aqi <= 150) return 'UNHEALTHY';
    return 'HAZARDOUS';
  }

  function val(v) {
    return v !== null && v !== undefined ? v.toFixed(1) : '—';
  }

  function relTime(iso) {
    if (!iso) return '—';
    const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (diff < 60)  return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    return `${Math.floor(diff/3600)}h ago`;
  }

  function showError(msg) {
    const b = document.getElementById('errorBanner');
    b.textContent = msg;
    b.classList.add('visible');
    setTimeout(() => b.classList.remove('visible'), 5000);
  }

  async function loadReadings() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('loading');
    btn.textContent = 'Loading...';

    const city = document.getElementById('cityFilter').value;
    let url = `${LB}/readings/latest?sort=${currentSort}&limit=10`;
    if (city) url += `&city=${encodeURIComponent(city)}`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      renderCards(data);
      document.getElementById('lastUpdated').textContent =
        'Updated ' + new Date().toLocaleTimeString();
    } catch (e) {
      showError(`Could not reach load balancer: ${e.message}`);
      document.getElementById('cardsGrid').innerHTML =
        '<div class="empty-state">Failed to load data. Check server status.</div>';
    } finally {
      btn.classList.remove('loading');
      btn.textContent = 'Refresh';
    }
  }

  function renderCards(data) {
    const grid = document.getElementById('cardsGrid');
    if (!data.length) {
      grid.innerHTML = '<div class="empty-state">No readings found. Try clicking "Poll Now".</div>';
      return;
    }

    grid.innerHTML = data.map((r, i) => `
      <div class="card ${aqiClass(r.aqi)}" style="animation-delay:${i * 0.07}s">
        <div class="card-header">
          <span class="city-name">${r.city}</span>
          <span class="aqi-badge">AQI ${r.aqi ?? '—'} · ${aqiLabel(r.aqi)}</span>
        </div>
        <div class="pollutants">
          <div class="pollutant">
            <span class="pollutant-label">PM2.5</span>
            <span class="pollutant-value">${val(r.pm25)} <span class="pollutant-unit">µg/m³</span></span>
          </div>
          <div class="pollutant">
            <span class="pollutant-label">PM10</span>
            <span class="pollutant-value">${val(r.pm10)} <span class="pollutant-unit">µg/m³</span></span>
          </div>
          <div class="pollutant">
            <span class="pollutant-label">NO₂</span>
            <span class="pollutant-value">${val(r.no2)} <span class="pollutant-unit">µg/m³</span></span>
          </div>
          <div class="pollutant">
            <span class="pollutant-label">O₃</span>
            <span class="pollutant-value">${val(r.o3)} <span class="pollutant-unit">µg/m³</span></span>
          </div>
        </div>
        <div class="card-footer">Recorded ${relTime(r.recorded_at)}</div>
      </div>
    `).join('');
  }

  async function loadAlerts() {
    try {
      const res = await fetch(`${LB}/alerts/recent`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      renderAlerts(data);
    } catch (e) {
      document.getElementById('alertsList').innerHTML =
        '<div class="empty-state">Could not load alerts.</div>';
    }
  }

  function renderAlerts(data) {
    const el = document.getElementById('alertsList');
    if (!data.length) {
      el.innerHTML = '<div class="empty-state">No anomalies detected recently. Air quality is normal.</div>';
      return;
    }
    el.innerHTML = data.slice(0, 10).map((a, i) => `
      <div class="alert-row" style="animation-delay:${i * 0.05}s">
        <span class="alert-city">${a.city}</span>
        <span class="alert-pollutant">${a.pollutant?.toUpperCase()}</span>
        <span class="alert-zscore">Z-score: ${a.z_score?.toFixed(2)} · Value: ${a.value?.toFixed(1)}</span>
        <span class="alert-time">${relTime(a.fired_at)}</span>
      </div>
    `).join('');
  }

  async function triggerPoll() {
    try {
      const res = await fetch(`${LB}/poll/now`, { method: 'POST' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      setTimeout(loadReadings, 2000); // reload after 2s
    } catch (e) {
      showError(`Poll failed: ${e.message}`);
    }
  }

  // initial load
  loadReadings();
  loadAlerts();

  // auto-refresh every 5 minutes
  setInterval(() => { loadReadings(); loadAlerts(); }, 5 * 60 * 1000);
</script>

</body>
</html>
